name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      # -W is on inside the Makefile target, so a broken cross-reference fails
      # the build rather than passing with a dangling link.
      - run: make docs PYTHON=$(command -v python)
      # Publishing to GitHub Pages is intentionally disabled: Pages on a private
      # repo needs a paid org plan. This job still builds the docs so broken
      # references fail CI. To re-enable, restore the configure-pages and
      # upload-pages-artifact steps plus the deploy job (see git history).
