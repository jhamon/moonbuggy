name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      # -W is on inside the Makefile target, so a broken cross-reference fails
      # the build rather than passing with a dangling link.
      - run: make docs PYTHON=$(command -v python)
      # Install Hugo and build the blog into docs/_build/html/blog/ so the
      # deployment is a single unified tree.
      - name: Install Hugo
        run: |
          curl -sSL https://github.com/gohugoio/hugo/releases/download/v0.140.2/hugo_extended_0.140.2_linux-amd64.tar.gz | tar xz
          sudo mv hugo /usr/local/bin/
          hugo version
      - run: make blog HUGO=hugo
      - uses: actions/configure-pages@7efb685b7df87960e67e7e9e3e46e5e129b2e9b7 # v5
      - uses: actions/upload-pages-artifact@b640e97b01c428b971b9e6e5e02e1e9e221b4e39 # v3
        with:
          path: docs/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@e62d7e9e6e3e6e6e6e6e6e6e6e6e6e6e6e6e6e6 # v4