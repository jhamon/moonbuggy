line = 11
operator = "constant_int"
original = "CACHE_SIZE = 128"
mutated = "CACHE_SIZE = 129"
status = "SKIPPED"
killed_by = []
case = "suppressed"
note = """
SUPPRESSION CASE (A3). Suppressed by the inline `# moonbuggy: skip` marker on
the source line. Genuinely equivalent -- a cache size has no observable
behaviour to assert on -- so it would otherwise survive forever as permanent
report noise, which is the workflow 3.3 describes.

Must be reported SKIPPED, not omitted. Silent omission would make the mutant
count drift from the inventory with no way to tell suppression from a generator
bug.
"""

