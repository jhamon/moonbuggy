[[mutant]]
id = "discounts-L7-const"
module = "sample/discounts.py"
line = 7
operator = "constant_int"
original = "BULK_THRESHOLD = 10"
mutated = "BULK_THRESHOLD = 11"
status = "KILLED"
killed_by = [
  "tests/test_pricing.py::test_threshold_exactly_qualifies",
  "tests/test_pricing.py::test_bulk_discount_is_twenty_percent",
]
case = "module-level"
note = """
MODULE-LEVEL CASE (A3). This line executes at import time, not inside any test
body, so a line->test map built from test-body execution alone may attribute it
to no test at all -- and a tool that then runs zero tests would report it as
uncovered (NO_COVERAGE on the fast path) when the suite kills it outright.
That is a silent false negative, and this mutant is here to catch it. Correct
behaviour: a module-level mutant must select every test that (transitively)
imports the module.
"""

[[mutant]]
id = "discounts-L11-cmp"
module = "sample/discounts.py"
line = 11
operator = "comparison_swap"
original = "return quantity >= BULK_THRESHOLD"
mutated = "return quantity > BULK_THRESHOLD"
status = "KILLED"
killed_by = ["tests/test_pricing.py::test_threshold_exactly_qualifies"]
case = "cross-file-kill"
note = """
CROSS-FILE CASE (A3). test_discounts.py is the obvious test file for this
module and every one of its tests PASSES under this mutation -- it never probes
the boundary. The only killer lives in test_pricing.py. Selection driven by file
naming, or by any heuristic short of a real coverage map, reports SURVIVED here.
"""

[[mutant]]
id = "discounts-L15-cond"
module = "sample/discounts.py"
line = 15
operator = "condition_negation"
original = "if qualifies_for_bulk(quantity):"
mutated = "if not qualifies_for_bulk(quantity):"
status = "KILLED"
killed_by = [
  "tests/test_discounts.py::test_no_discount_for_small_order",
  "tests/test_pricing.py::test_bulk_discount_is_twenty_percent",
]
note = """
A Call in test position. No other operator touches this line: there is no
comparison, no boolean operator and no literal in it, so before
condition_negation the entire branch was unmutated and a suite blind to
qualifies_for_bulk would have produced no finding at all.
"""

[[mutant]]
id = "discounts-L16-const"
module = "sample/discounts.py"
line = 16
operator = "constant_int"
