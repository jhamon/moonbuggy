case = "comprehension-guard"
note = """
COMPREHENSION GUARD, and a genuine survivor. `wanted` is only ever called with
an empty list, so both the guard and its negation filter nothing and the test
cannot tell them apart. A real gap of the ordinary kind: the collection was
covered, the predicate inside it never was.

Also the structural case for the context seam. `ast.comprehension` carries no
lineno of its own -- like `ast.arguments` -- so an operator handed that node
could not produce a spliceable mutant. The guard expression does carry one, and
the parent-and-field context is what identifies it as a guard rather than as
some arbitrary Name.
"""
