note = """
Two mutants on line 13 from two operators, and they are different questions.
comparison_swap moves the boundary by one and survives, because no test sits on
it. condition_negation inverts the branch outright and dies immediately. Broad
and narrow mutations of the same condition are both worth having; only one of
them is a finding.
"""

[[mutant]]
id = "inventory-L14-arith"
module = "sample/inventory.py"
line = 14
operator = "arithmetic_swap"
original = "return target - stock"
mutated = "return target + stock"
status = "KILLED"
killed_by = ["tests/test_inventory.py::test_restock_fills_to_target"]

[[mutant]]
id = "inventory-L15-const"
module = "sample/inventory.py"
line = 15
operator = "constant_int"
original = "return 0"
mutated = "return 1"
status = "SURVIVED"
fast_path_status = "NO_COVERAGE"
killed_by = []
case = "no-covering-test"
note = """
NO-COVERAGE CASE. Line 15 is never executed by any test -- restock_amount is
only ever called with stock < target. The line->test map must yield an EMPTY
covering set, and moonbuggy must report NO_COVERAGE without running any test.
Pins a real semantic decision: uncovered mutants are a finding, not an
exclusion. SKIPPED means deliberately excluded, and must never be used here --
an untested line must not be hidden from the report.

The two labels differ because the two engines can see different things. The
naive runner mutates the file and runs the entire suite, which passes, so all
it can honestly say is SURVIVED; it has no way to know no test touched the
line. moonbuggy has the coverage map and does know, so it says the more
specific thing. Both statuses exit 1: the disagreement is about which finding
this is, never about whether it is one.
"""

