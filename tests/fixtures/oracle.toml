#  Hand-written oracle for the sample_project fixture  (criterion A2b)
#
#  WHAT THIS IS
#  Every mutant moonbuggy is expected to generate for the fixture, with the
#  status it must report. Written by reasoning about the fixture's source and
#  tests, before any engine code existed. NEVER regenerate this from moonbuggy's
#  output -- that would make the criteria self-certifying and is the one failure
#  mode the whole two-source oracle design exists to prevent.
#
#  WHY IT EXISTS ALONGSIDE THE GENERATED ORACLE
#  The naive differential oracle (A2a) runs each mutant against the full suite
#  under plain pytest, and covers execution correctness far more cheaply than
#  hand-labelling. But both it and the fast path consume the same AST operators,
#  so a mutant that is never *generated* is invisible to it -- both sides agree,
#  both are wrong. This file is the mutant inventory that closes that gap.
#
#  EDITING
#  Changes belong in their own commit with a written reason. `git log --follow`
#  on this file is how an evaluator checks the labels were not quietly bent to
#  match a failing implementation.

#  TWO EXPECTED STATUSES, ON PURPOSE
#  `status` is what the naive runner must report: it has no coverage map and
#  runs the whole suite for every mutant, so it cannot tell an unreached line
#  from an unasserted one. `fast_path_status`, where present, is what
#  moonbuggy's coverage-guided path must report instead, and the entry's note
#  says why the two differ. A label without `fast_path_status` means both
#  engines must agree, which is every mutant but one.

[meta]
fixture = "sample_project"
total_mutants = 29
expected_counts = { KILLED = 21, SURVIVED = 6, TIMEOUT = 1, SKIPPED = 1 }
expected_counts_fast = { KILLED = 21, SURVIVED = 5, NO_COVERAGE = 1, TIMEOUT = 1, SKIPPED = 1 }

#  OPERATOR SPEC
#  The inventory below is only well-defined given exact operator semantics, so
#  they are pinned here. This doubles as the specification the operators in
#  src/moonbuggy/operators/ are built to satisfy (criterion C1).
[operators.comparison_swap]
description = "Each comparison maps to exactly one replacement, chosen to probe the boundary rather than to invert the predicate. One mutant per site keeps mutant counts proportional to code size."
mapping = { "<" = "<=", "<=" = "<", ">" = ">=", ">=" = ">", "==" = "!=", "!=" = "==" }

[operators.boolean_swap]
description = "Binary boolean operators only. `not` is not mutated."
mapping = { "and" = "or", "or" = "and" }

[operators.arithmetic_swap]
description = "Applies to binary operations and to augmented assignment (`+=` is a site, same as `+`)."
mapping = { "+" = "-", "-" = "+", "*" = "/", "/" = "*", "//" = "/", "%" = "//", "**" = "*" }

[operators.constant_int]
description = "Integer literals mutate to n+1. Floats are deliberately NOT mutated: it invites float-comparison flakiness in the oracle for no extra signal."
rule = "n -> n + 1"

[operators.constant_bool]
description = "Boolean literals invert. No site in this fixture exercises it; covered by unit tests instead."
mapping = { "True" = "False", "False" = "True" }

[operators.boundary]
description = "range(n) -> range(n - 1). Only the single-argument form."
rule = "range(x) -> range(x - 1)"

[operators.condition_negation]
description = """
The test of an `if`/`elif`, of a conditional expression, and each `if` clause of
a comprehension, wrapped in `not (...)`. One mutant per condition, whatever
shape the condition has -- a call, a name, a `not`, anything. This is the only
operator that reaches a condition with no comparison, boolean operator or
literal in it, which is the ordinary shape of `if is_valid(x):`.

Two deliberate exclusions.

`while` tests are NOT negated. Negating a loop test either skips the loop --
which nearly any assertion catches, so the mutant teaches nothing -- or, when
the test was false to begin with, never terminates: `while queue:` becomes
`while not queue:` and burns the entire `--timeout`. Empty-input tests are
common, so a loop-heavy module would pay that repeatedly for a mutation no
human plausibly writes.

Literal tests are NOT negated. `if True:` already produces `if False:` from
constant_bool, and `if not True:` is the same mutation counted twice.
"""
rule = "test -> not (test)"

[operators.statement_deletion]
description = """
DEEP TIER, and so absent from every mutant listed below: the inventory in this
file is a bare `moonbuggy` run, which is the `default` tier. Pinned here anyway
because the inventory is only well-defined given exact operator semantics, and
"this operator generates nothing in a default run" is one of them.

A simple statement in a body is replaced by `pass`, spliced at its own
`col_offset` so the indentation survives. Compound statements are excluded by
an allowlist rather than by the multi-line splice guard: `if x: return` fits on
one line, and deleting the `If` would delete a branch and its body rather than
one statement.

Never generated for a statement that is provably inert, because each of those
is an equivalent mutant somebody has to read and dismiss:

  - a bare `Expr` whose value is a Constant or a Name. Docstrings and `...`
    are this shape.
  - `pass`, `global`, `nonlocal`.
  - `import`, `from ... import`, and `type X = ...`. Not equivalent -- the
    opposite, a NameError at every use -- but a crash-kill carrying no
    information about test quality. Each establishes a name later code refers
    to, so deleting one does not produce a subtler program to test the suite
    against. `type X = int` followed by `def f(a: X)` is exactly that:
    annotations are evaluated when the `def` runs, so the mutant dies on the
    alias's absence and reports nothing about the suite.
  - `x = <expr>` where the right-hand side contains no Call, Await or Yield,
    the target is a plain Name, and nothing in the enclosing function reads
    `x`. A dead store. "Reads" is asked of the whole function body rather than
    of the statements after it, because a read above the write is still a read
    after it once the two share a loop.

Everything else is mutated, by subtraction. The heuristic runs in this
direction on purpose: a wrong answer about inertness costs noise, and a wrong
answer about impact costs a finding.
"""
rule = "statement -> pass"

[operators.argument_swap]
description = """
DEEP TIER, and so absent from every mutant listed below, like statement_deletion
and for the same reason: the inventory in this file is a bare `moonbuggy` run.
It also generates nothing anywhere in this fixture's `sample/` modules even
under `--operators all` -- no call in them passes two positional arguments --
which is worth writing down, because "this operator produced no mutant here" is
otherwise indistinguishable from "this operator is broken".

Two *adjacent* positional arguments in a call are exchanged. Adjacent-only, so
an n-argument call yields n-1 mutants rather than n!, and because transposing
two neighbours is the mistake people actually make.

Three sites are skipped, all of them cheap certainties rather than inference:

  - a call with fewer than two positional arguments.
  - a pair where either position is starred. `f(*args, y)` unpacks a sequence
    of unknown length, so the swap is not "two arguments in the wrong order".
  - a pair identical as source -- `f(x, x)`, `f(0, 0)`. Equivalent by
    construction.

Whether two *distinct* arguments are interchangeable is a question about types
and about the callee, and there is no type inference here to ask it with. Those
equivalents are the operator's known cost, and the accepted-equivalents ledger
is where they get retired.
"""
rule = "f(a, b) -> f(b, a), adjacent pairs only"

[operators.default_arg]
description = """
DEEP TIER, and generating nothing in this fixture: no parameter in `sample/`
defaults to None.

A parameter default of `None` becomes `0`. The node mutated is the default
*expression*, not the `ast.arguments` holding it -- which carries no lineno --
and not the enclosing `def`, which would unparse its whole body onto one line.

Only `None`. Every other default is either already reached or has no narrow
replacement:

  - an integer or boolean default is reached by constant_int / constant_bool,
    in the DEFAULT tier. `def fetch(url, retries=3)` -> `retries=4` is a real
    and wanted mutant and it is already generated; producing it here as well
    would put two byte-identical survivors in the report under two ids.
  - a float default is not mutated for the same reason no float is.
  - a string default cannot be mutated without breaking criterion C2.
  - a computed default (`clock=time.time`, `items=()`) has no plausible narrow
    mutation.

`0` rather than any other value because it is falsy like `None`, so it
separates the two ways code tests a sentinel default: `if timeout is None:`
takes the other branch and `if not timeout:` does not.
"""
rule = "param=None -> param=0"

[operators.kwarg_drop]
description = """
DEEP TIER, and generating nothing in this fixture: no call in `sample/` passes
an explicit keyword argument.

An explicit keyword argument is removed from a call, so the callee's own
default applies -- `connect(host, timeout=30)` -> `connect(host)`. One mutant
per named keyword. `**kwargs` is never dropped: it names no parameter, so there
is no default to fall back to, and it stands for an unknown number of arguments
at once.

Expected to produce crash-kills where the parameter is required rather than
defaulted: every test then raises TypeError. Those are reported KILLED_BY_ERROR
rather than KILLED, which is what keeps the kill rate meaningful and is why
this operator waited for that status to exist.
"""
rule = "f(a, k=v) -> f(a)"

