# Makes this fixture a self-contained pytest project (criterion A1).
#
# Without an ini file here, pytest walks up and finds the moonbuggy repo's own
# pyproject.toml, sets rootdir to the repo root, and emits node ids like
# `tests/fixtures/sample_project/tests/test_pricing.py::test_x`. Those cannot be
# handed back to pytest when running from this directory, which breaks
# coverage-guided selection in a way that looks like a moonbuggy bug rather than
# a configuration accident.
#
# xdist is not enabled by default -- `-n` is passed at runtime by the tests that
# exercise the worker path, so the ordinary run stays single-process.
[pytest]
testpaths = tests
