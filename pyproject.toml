[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moonbuggy"
version = "0.0.1"
description = "Fast, agent-first mutation testing for Python"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jennifer Hamon" }]
dependencies = [
  "coverage>=7.4",
  "pytest-cov>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  # Milestone M1.2. The operator tests assert on examples chosen by the person
  # who wrote the operators, which is the blind spot Hypothesis exists to cover.
  "hypothesis>=6.100",
]
# Only needed to run the comparative benchmark (criteria G1-G4) and the
# advisory differential check (A5). Not required to use moonbuggy.
bench = [
  "mutmut>=3.0",
]
# Milestone M3.1.4: everything `make docs` needs, so a clean venv can build the
# documentation from a fresh checkout. Nothing here is required to use
# moonbuggy, and nothing built from it is published anywhere (M3.1.5).
docs = [
  "sphinx>=7.3",
  "myst-parser>=3.0",
  "furo>=2024.1",
  # M3.2.1: the docstring coverage gate. Runs as part of `make docs`, so a new
  # public function without a docstring fails the build rather than being
  # noticed later by nobody.
  "interrogate>=1.7",
  # M3.2.2/M3.2.3: checks that every documented parameter exists, every
  # parameter is documented, and that it is all Google style. A convention
  # nothing enforces is a convention the next file quietly breaks.
  "pydoclint>=0.5",
]
# Milestone M5: the static quality gate. Pinned here so a clean venv can run
# `make lint`, `make format-check`, and `make typecheck` from a fresh checkout.
# Not required to use moonbuggy.
lint = [
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
moonbuggy = "moonbuggy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/moonbuggy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The fixture project under tests/fixtures is *input data* for moonbuggy's own
# test suite, not tests of moonbuggy. Its tests are meant to be run by moonbuggy
# (and by the naive oracle runner), never collected by the outer run -- several
# of them are designed to be slow or to hang under mutation.
#
# `slow` is deselected by default. Those tests spawn one pytest process per
# mutant (and one of them waits out a real timeout), so they belong to
# `make check-oracle` rather than to the edit-run-edit loop.
addopts = "--ignore=tests/fixtures -m 'not slow'"
markers = [
  "slow: spawns a subprocess per mutant; run via `make check-oracle`",
]

[tool.interrogate]
# M3.2.1: 100% docstring coverage for the public API. Private helpers are
# exempt (M3.2.4) -- a leading underscore is a statement that the name is not
# part of the contract, and requiring a docstring on every one of them buys
# ceremony rather than clarity. The ones that encode a non-obvious decision
# keep their explanatory comment instead.
fail-under = 100
ignore-private = true
# `ignore-private` only covers dunder-prefixed names; this is the one that
# covers a single leading underscore, which is what M3.2.4's exemption means.
ignore-semiprivate = true
ignore-magic = true
ignore-nested-functions = true
ignore-init-method = true
ignore-module = false
exclude = ["src/moonbuggy/__pycache__"]
verbose = 1
quiet = false

[tool.pydoclint]
# M3.2.2/M3.2.3: Google style, checked rather than asserted. Every documented
# parameter must exist and every parameter must be documented, so a signature
# change that leaves the docstring behind fails the build.
style = "google"
# M5.3: the flip to signature type hints is the M5.3 convention change --
# mypy strict is being rolled out module by module, and a module has to be
# annotated before pydoclint can require its signature to carry hints. These
# are exactly the modules still on the `[[tool.mypy.overrides]]` list in
# `[tool.mypy]` above: excluded here only until they are annotated. Tasks 4,
# 5, and 6 each delete their own entries as they land, and Task 7 removes
# whatever is left.
exclude = '\.venv|__pycache__|src/moonbuggy/operators|src/moonbuggy/inmemory\.py|src/moonbuggy/codeswap\.py|src/moonbuggy/generate\.py|src/moonbuggy/naive\.py|src/moonbuggy/profiling\.py|src/moonbuggy/report\.py|src/moonbuggy/plugin\.py|src/moonbuggy/baseline\.py|src/moonbuggy/forkserver\.py|src/moonbuggy/coverage_pass\.py|src/moonbuggy/runner\.py|src/moonbuggy/cli\.py'
# Private helpers are exempt from the coverage gate, so they are exempt from
# the completeness gate too -- otherwise the exemption is not one.
skip-checking-short-docstrings = true
allow-init-docstring = true
# Type hints are now this codebase's convention (M5.3): the signature is the
# authority, so docstrings are not required to repeat types.
arg-type-hints-in-signature = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
# Several functions document an exception raised by something they call --
# `read_source` raising SourceError out of srcio, say. That is the exception
# the caller has to handle, and where the `raise` statement physically lives
# is not information the caller needs.
skip-checking-raises = true

[tool.ruff]
# Milestone M5.2. 88 is ruff's default. The prose comments in this codebase
# wrap nearer 79, and the formatter does not rewrap comments or docstrings, so
# they stay as written -- the extra width is available to code.
line-length = 88
target-version = "py312"
# tests/fixtures is *input data* for moonbuggy's own suite, not code this
# project maintains. It deliberately contains a file with a syntax error
# (M1.4.1) and a file in a non-UTF8 encoding (M1.4.7). A linter pointed at it
# fails on input it is designed to fail on.
# "*.md" excludes Markdown files -- ruff format rewrites Python code fences
# inside them, and docs/oss-findings.md's fences are quoted suggested tests
# against other people's projects, not source this project maintains.
extend-exclude = ["tests/fixtures", "docs/_build", ".venv", "*.md"]

[tool.ruff.lint]
# M5.1: chosen for this code rather than inherited from ALL and then riddled
# with suppressions. E/F/W are the pyflakes and pycodestyle core, I sorts
# imports, UP catches syntax kept alive past its Python version, B is bugbear,
# SIM is the readability set.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# conf.py must adjust sys.path before importing the package, which is E402.
# That is the file's contract with Sphinx, not a style choice, so it is
# exempted here rather than with a `# noqa` -- M5.1.2 wants zero inline
# suppressions. (The file also carries a `# noqa: A001` for Sphinx's required
# module-level `copyright` name. A-rules are not in `select`, so that
# suppression is inert and Task 1 Step 8 simply deletes it.)
"docs/conf.py" = ["E402"]
# `copy` is re-exported here on purpose, not consumed here -- it is kept
# importable as `moonbuggy.operators.copy` for operators that need it, without
# every operator module having to import it itself (M5.1.3).
"src/moonbuggy/operators/__init__.py" = ["F401"]
# These scripts and this test module each need `sys.path.insert` to run before
# a local, not-installed module can be imported (the sibling `workloads`
# module, or a script's own `scripts/` or `src/` directory). That ordering is
# the file's contract, not a style choice -- the same reasoning as
# docs/conf.py above.
"scripts/ab_compare.py" = ["E402"]
"scripts/differential.py" = ["E402"]
"scripts/profile_run.py" = ["E402"]
"scripts/verify_findings.py" = ["E402"]
"tests/test_ab_harness.py" = ["E402"]

[tool.mypy]
# Milestone M5.3. Strict over the package only -- tests/ and scripts/ are
# harnesses and benchmark drivers, and annotating them buys ceremony.
python_version = "3.12"
files = ["src/moonbuggy"]
strict = true
# An un-annotated module is not an excuse for a red gate while M5.3 is in
# progress. Each of Tasks 4-6 deletes its modules from the list below, so
# `make typecheck` is green at every commit and the list is the visible
# remaining work.
[[tool.mypy.overrides]]
module = [
  "moonbuggy.operators.*",
  "moonbuggy.inmemory",
  "moonbuggy.codeswap",
  "moonbuggy.generate",
  "moonbuggy.naive",
  "moonbuggy.profiling",
  "moonbuggy.report",
  "moonbuggy.plugin",
  "moonbuggy.baseline",
  "moonbuggy.forkserver",
  "moonbuggy.coverage_pass",
  "moonbuggy.runner",
  "moonbuggy.cli",
]
ignore_errors = true
