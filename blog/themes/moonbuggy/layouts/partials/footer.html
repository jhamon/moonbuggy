<script>
// Theme toggle matching the Sphinx/Furo docs behavior
(function() {
  const toggle = document.getElementById('theme-toggle');
  const html = document.documentElement;

  function setTheme(theme) {
    html.setAttribute('data-theme', theme);
    localStorage.setItem('moonbuggy-theme', theme);
  }

  // On load, respect stored preference, then OS preference, then light
  const stored = localStorage.getItem('moonbuggy-theme');
  if (stored) {
    setTheme(stored);
  } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    setTheme('dark');
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });
  }
})();
</script>
