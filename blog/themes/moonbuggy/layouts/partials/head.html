<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- Same fonts as the Sphinx/Furo docs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400..800&display=swap" rel="stylesheet">

<!-- absURL prefixes baseURL (https://jhamon.github.io/moonbuggy/) so the CSS
     always resolves to /moonbuggy/blog/css/blog.css from any blog page depth. -->
<link rel="stylesheet" href="{{ "blog/css/blog.css" | absURL }}">
<link rel="icon" type="image/svg+xml" href="{{ "blog/favicon.svg" | absURL }}">
